<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depósito de agua de lluvia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f18;
      --panel-bg: rgba(16, 24, 39, 0.75);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --water-top: #00c6ff;
      --water-bottom: #0072ff;
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shine: rgba(255, 255, 255, 0.05);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --error-color: #ff4b4b;
      --success-color: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 114, 255, 0.08) 0%, transparent 40%);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text-main);
      padding: 1.5rem;
    }

    .dashboard-card {
      display: grid;
      grid-template-columns: minmax(180px, 220px) minmax(220px, 280px) 1fr;
      gap: 2.5rem;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 2.5rem;
      border-radius: 28px;
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 var(--glass-shine);
      max-width: 1250px;
      width: 100%;
    }

    .tank-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
    }

    .tank-ticks {
      position: absolute;
      left: -28px;
      height: calc(100% - 24px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      user-select: none;
    }

    .tank-ticks span { position: relative; }
    .tank-ticks span::after {
      content: '';
      position: absolute;
      right: -8px;
      top: 50%;
      width: 5px;
      height: 1px;
      background: var(--text-muted);
      opacity: 0.5;
    }

    .tank {
      width: 160px;
      height: 48vh;
      max-height: 360px;
      min-height: 260px;
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px 16px 24px 24px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 0 20px rgba(0, 0, 0, 0.4),
        inset 0 0 15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
    }

    .tank::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        115deg, 
        rgba(255, 255, 255, 0.15) 0%, 
        rgba(255, 255, 255, 0.03) 30%, 
        transparent 30%, 
        transparent 85%, 
        rgba(255, 255, 255, 0.05) 100%
      );
      z-index: 10;
      pointer-events: none;
    }

    .tank::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 11;
      pointer-events: none;
    }

    .segment {
      flex: 1;
      width: 100%;
      background: transparent;
      transition: background-color 0.2s linear, box-shadow 0.2s ease;
      position: relative;
      z-index: 2;
    }

    .segment.filled {
      background: linear-gradient(90deg, var(--water-bottom), var(--water-top));
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .segment.filled:last-child,
    .segment.filled + .segment:not(.filled) {
      position: relative;
    }

    .segment.filled + .segment:not(.filled)::before,
    .segment.filled:last-of-type::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: -50%;
      width: 200%;
      height: 6px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 40%;
      animation: wave 3s infinite linear;
      box-shadow: 0 0 10px #fff;
      z-index: 5;
    }

    @keyframes wave {
      0% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(-25%) rotate(3deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }

    .metrics-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header-tag {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    #percentage {
      margin: 0;
      font-size: clamp(3rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 30%, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.03em;
    }

    #percentage span {
      font-size: 0.45em;
      margin-left: 2px;
      color: var(--accent-cyan);
      -webkit-text-fill-color: var(--accent-cyan);
      font-weight: 400;
    }

    .label {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.3rem;
      margin-bottom: 1.5rem;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.85rem 1rem;
      border-radius: 14px;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .info-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0, 242, 254, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
    }

    .info-details { display: flex; flex-direction: column; }
    .info-details .caption { font-size: 0.7rem; color: var(--text-muted); }

    #distance {
      margin: 0;
      font-weight: 600;
      font-size: 1.1rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-main);
    }

    #status {
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      margin: 0;
    }

    #status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success-color);
      box-shadow: 0 0 8px var(--success-color);
    }

    #status.error { color: #fca5a5; }
    #status.error::before {
      background: var(--error-color);
      box-shadow: 0 0 8px var(--error-color);
    }

    .chart-panel {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 320px;
    }

    .chart-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .chart-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-group {
      display: flex;
      gap: 0.25rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.2rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .filter-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .filter-btn.active {
      background: rgba(0, 242, 254, 0.2);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 242, 254, 0.3);
      font-weight: 600;
    }

    .chart-container {
      flex: 1;
      width: 100%;
      position: relative;
    }

    svg.history-chart {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .chart-axis-label {
      font-size: 0.6rem;
      fill: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .rain-counter-card {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: rgba(0, 242, 254, 0.03);
      border: 1px solid rgba(0, 242, 254, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rain-counter-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .rain-counter-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-cyan);
    }

    @media (max-width: 900px) {
      .dashboard-card {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .tank-wrapper { order: 1; }
      .metrics-panel { order: 2; align-items: center; text-align: center; }
      .chart-panel { order: 3; }
      .info-box { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="dashboard-card">
    <div class="tank-wrapper">
      <div class="tank-ticks">
        <span>100</span>
        <span>75</span>
        <span>50</span>
        <span>25</span>
        <span>0</span>
      </div>
      <section id="tank" class="tank"></section>
    </div>

    <section class="metrics-panel" aria-live="polite">
      <span class="header-tag">Sistema Pluvial</span>
      <h1 id="percentage">--<span>%</span></h1>
      <p class="label">Nivel de llenado</p>
      
      <div class="info-box">
        <div class="info-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20a8 8 0 0 0 8-8 8 8 0 0 0-8-8 8 8 0 0 0-8 8 8 0 0 0 8 8z" opacity="0.3"></path>
            <path d="M12 16a4 4 0 0 0 4-4 4 4 0 0 0-4-4 4 4 0 0 0-4 4 4 4 0 0 0 4 4z"></path>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path>
          </svg>
        </div>
        <div class="info-details">
          <span class="caption">Distancia al sensor</span>
          <p id="distance">-- cm</p>
        </div>
      </div>

      <p id="status">Consultando depósito…</p>
    </section>

    <section class="chart-panel">
      <div class="chart-header">
        <div class="chart-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          Evolución de Nivel
        </div>
        <div class="filter-group">
          <button class="filter-btn" data-minutes="5">5m</button>
          <button class="filter-btn" data-minutes="30">30m</button>
          <button class="filter-btn" data-minutes="60">1h</button>
          <button class="filter-btn" data-minutes="180">3h</button>
          <button class="filter-btn" data-minutes="360">6h</button>
          <button class="filter-btn" data-minutes="720">12h</button>
          <button class="filter-btn active" data-minutes="1440">24h</button>
        </div>
      </div>

      <div class="chart-container">
        <svg id="chart-svg" class="history-chart" viewBox="-30 0 360 150" preserveAspectRatio="none">
          <defs>
            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#0072ff" stop-opacity="0.0"/>
            </linearGradient>
          </defs>

          <line x1="0" y1="10" x2="300" y2="10" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3,3"/>
          <line x1="0" y1="37.5" x2="300" y2="37.5" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3,3"/>
          <line x1="0" y1="65" x2="300" y2="65" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3,3"/>
          <line x1="0" y1="92.5" x2="300" y2="92.5" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3,3"/>
          <line x1="0" y1="120" x2="300" y2="120" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3,3"/>

          <!-- Eje Izquierdo: % -->
          <text x="-8" y="13" class="chart-axis-label" text-anchor="end">100%</text>
          <text x="-8" y="40" class="chart-axis-label" text-anchor="end">75%</text>
          <text x="-8" y="68" class="chart-axis-label" text-anchor="end">50%</text>
          <text x="-8" y="95" class="chart-axis-label" text-anchor="end">25%</text>
          <text x="-8" y="123" class="chart-axis-label" text-anchor="end">0%</text>

          <!-- Eje Derecho: Litros -->
          <text x="308" y="13" class="chart-axis-label" text-anchor="start">1000L</text>
          <text x="308" y="40" class="chart-axis-label" text-anchor="start">750L</text>
          <text x="308" y="68" class="chart-axis-label" text-anchor="start">500L</text>
          <text x="308" y="95" class="chart-axis-label" text-anchor="start">250L</text>
          <text x="308" y="123" class="chart-axis-label" text-anchor="start">0L</text>

          <polygon id="chart-area" points="" fill="url(#chartGradient)"/>
          <polyline id="chart-line" points="" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
          <g id="chart-points"></g>

          <text id="start-label" x="0" y="142" class="chart-axis-label">-24h</text>
          <text id="mid-label" x="140" y="142" class="chart-axis-label">-12h</text>
          <text x="270" y="142" class="chart-axis-label">Ahora</text>
        </svg>
      </div>

      <div class="rain-counter-card">
        <div class="rain-counter-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
          Lluvia acumulada en el rango:
        </div>
        <div id="rain-accumulated" class="rain-counter-value">0 L</div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "rainwater_history_24h";
    const MAX_STORE_MS = 24 * 60 * 60 * 1000;
    const TANK_CAPACITY_LITERS = 1000;

    let currentWindowMinutes = 1440;

    const tank = document.getElementById("tank");
    const percentageElement = document.getElementById("percentage");
    const distanceElement = document.getElementById("distance");
    const statusElement = document.getElementById("status");
    const rainAccumulatedElement = document.getElementById("rain-accumulated");
    
    const chartLine = document.getElementById("chart-line");
    const chartArea = document.getElementById("chart-area");
    const chartPoints = document.getElementById("chart-points");
    const startLabel = document.getElementById("start-label");
    const midLabel = document.getElementById("mid-label");

    const segments = [];

    for (let index = 0; index < 100; index++) {
      const segment = document.createElement("div");
      segment.className = "segment";
      tank.appendChild(segment);
      segments.push(segment);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentWindowMinutes = parseInt(e.target.getAttribute('data-minutes'), 10);
        
        updateAxisLabels(currentWindowMinutes);
        
        let history = [];
        try { history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) {}
        renderChart(history);
      });
    });

    function updateAxisLabels(minutes) {
      if (minutes >= 60) {
        const hours = minutes / 60;
        startLabel.textContent = `-${hours}h`;
        midLabel.textContent = `-${hours / 2}h`;
      } else {
        startLabel.textContent = `-${minutes}m`;
        midLabel.textContent = `-${minutes / 2}m`;
      }
    }

    function storeReading(percentage) {
      const now = Date.now();
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) { history = []; }
      
      history.push({ timestamp: now, percentage: percentage });
      history = history.filter(item => (now - item.timestamp) <= MAX_STORE_MS);
      
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
      
      renderChart(history);
    }

    function renderChart(history) {
      const windowMs = currentWindowMinutes * 60 * 1000;
      const now = Date.now();
      
      const filteredHistory = (history || []).filter(item => (now - item.timestamp) <= windowMs);

      let accumulatedLiters = 0;
      if (filteredHistory.length >= 2) {
        const initialPercentage = filteredHistory[0].percentage;
        const currentPercentage = filteredHistory[filteredHistory.length - 1].percentage;
        
        const percentageDiff = currentPercentage - initialPercentage;
        
        if (percentageDiff > 0) {
          accumulatedLiters = Math.round((percentageDiff / 100) * TANK_CAPACITY_LITERS);
        }
      }
      rainAccumulatedElement.textContent = `${accumulatedLiters} L`;

      if (!filteredHistory || filteredHistory.length < 2) {
        chartLine.setAttribute("points", "");
        chartArea.setAttribute("points", "");
        chartPoints.innerHTML = "";
        return;
      }

      const width = 300;
      const height = 120;
      const marginTop = 10;

      const points = filteredHistory.map(item => {
        const age = now - item.timestamp;
        const x = width - ((age / windowMs) * width);
        const y = height - ((item.percentage / 100) * (height - marginTop)) + marginTop;
        return { x: Math.max(0, Math.min(width, x)), y: Math.max(marginTop, Math.min(height, y)), val: item.percentage };
      }).sort((a, b) => a.x - b.x);

      const pointsString = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      chartLine.setAttribute("points", pointsString);

      const areaPoints = `0,${height} ${pointsString} ${width},${height}`;
      chartArea.setAttribute("points", areaPoints);

      chartPoints.innerHTML = "";
      const step = Math.max(1, Math.floor(points.length / 10));
      for (let i = 0; i < points.length; i += step) {
        const p = points[i];
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", p.x.toFixed(1));
        circle.setAttribute("cy", p.y.toFixed(1));
        circle.setAttribute("r", "3");
        circle.setAttribute("fill", "#00f2fe");
        circle.setAttribute("stroke", "#0a0f18");
        circle.setAttribute("stroke-width", "1");
        chartPoints.appendChild(circle);
      }
    }

    async function refresh() {
      try {
        let x = await fetch("/api/rainwater-tank/current-level", { cache: "no-store" });
        if (!x.ok) throw Error("HTTP " + x.status);
        x = await x.json();

        const percentage = Math.max(0, Math.min(100, Math.round(+x.fill_percentage)));
        const distance = +x.distance_cm;

        percentageElement.innerHTML = percentage + "<span>%</span>";
        distanceElement.textContent = distance.toFixed(1) + " cm";

        segments.forEach((segment, index) => {
          segment.classList.toggle("filled", index < percentage);
        });

        statusElement.textContent = "Actualizado";
        statusElement.className = "";

        storeReading(percentage);
      } catch (e) {
        statusElement.textContent = "Sin conexion: " + e.message;
        statusElement.className = "error";
      }
    }

    let existingHistory = [];
    try { existingHistory = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) {}
    renderChart(existingHistory);

    refresh();
    setInterval(refresh, 500);
  </script>
</body>
</html>
