<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="540" fill="#e9ecf3"/>
  <text x="24" y="30" fill="#2a2f42" font-size="16" font-weight="600">Sitio web de Jarvis (maqueta ilustrativa)</text>

  <!-- ===== Pantalla 1: Inicio con menú abierto ===== -->
  <text x="40" y="62" fill="#4b5263" font-size="12" font-weight="600">1 · Página de inicio ( / ) con el menú abierto</text>
  <rect x="40" y="72" width="390" height="440" rx="10" fill="#ffffff" stroke="#c4cada"/>
  <!-- cabecera -->
  <rect x="40" y="72" width="390" height="48" rx="10" fill="#171a26"/>
  <rect x="40" y="100" width="390" height="20" fill="#171a26"/>
  <rect x="56" y="88" width="22" height="3" rx="1.5" fill="#fff"/>
  <rect x="56" y="95" width="22" height="3" rx="1.5" fill="#fff"/>
  <rect x="56" y="102" width="22" height="3" rx="1.5" fill="#fff"/>
  <text x="92" y="103" fill="#fff" font-size="16" font-weight="700">Jarvis</text>

  <!-- contenido de la pagina -->
  <text x="60" y="162" fill="#171a26" font-size="20" font-weight="700">Bienvenido a Jarvis</text>
  <text x="60" y="184" fill="#4b5263" font-size="12">Asistente de voz en una Raspberry Pi con Arduino,</text>
  <text x="60" y="200" fill="#4b5263" font-size="12">memoria en grafo y vigilancia de un depósito de agua.</text>

  <!-- flujo -->
  <rect x="60" y="222" width="70" height="34" rx="6" fill="#dbe4ff"/><text x="95" y="243" font-size="11" text-anchor="middle" fill="#27407a">Micrófono</text>
  <text x="138" y="243" font-size="14" fill="#8892a6">→</text>
  <rect x="150" y="222" width="70" height="34" rx="6" fill="#dbe4ff"/><text x="185" y="243" font-size="11" text-anchor="middle" fill="#27407a">Vosk</text>
  <text x="228" y="243" font-size="14" fill="#8892a6">→</text>
  <rect x="240" y="222" width="90" height="34" rx="6" fill="#dbe4ff"/><text x="285" y="243" font-size="11" text-anchor="middle" fill="#27407a">Gemini/Vento</text>
  <text x="338" y="243" font-size="14" fill="#8892a6">→</text>
  <rect x="350" y="222" width="60" height="34" rx="6" fill="#dbe4ff"/><text x="380" y="243" font-size="11" text-anchor="middle" fill="#27407a">Voz</text>

  <!-- tarjetas -->
  <rect x="60" y="282" width="170" height="86" rx="8" fill="#f3f5fb" stroke="#d5daea"/>
  <text x="74" y="306" font-size="13" font-weight="600" fill="#171a26">Asistente de voz</text>
  <text x="74" y="326" font-size="11" fill="#4b5263">Di «Jarvis» y habla.</text>
  <text x="74" y="342" font-size="11" fill="#4b5263">Dos cerebros a elegir.</text>
  <rect x="240" y="282" width="170" height="86" rx="8" fill="#f3f5fb" stroke="#d5daea"/>
  <text x="254" y="306" font-size="13" font-weight="600" fill="#171a26">Depósito de agua</text>
  <text x="254" y="326" font-size="11" fill="#4b5263">Nivel y avisos en vivo.</text>
  <rect x="60" y="378" width="170" height="86" rx="8" fill="#f3f5fb" stroke="#d5daea"/>
  <text x="74" y="402" font-size="13" font-weight="600" fill="#171a26">Memoria en grafo</text>
  <text x="74" y="422" font-size="11" fill="#4b5263">Lo que Jarvis sabe</text>
  <text x="74" y="438" font-size="11" fill="#4b5263">de ti, creciendo.</text>
  <rect x="240" y="378" width="170" height="86" rx="8" fill="#f3f5fb" stroke="#d5daea"/>
  <text x="254" y="402" font-size="13" font-weight="600" fill="#171a26">Hardware</text>
  <text x="254" y="422" font-size="11" fill="#4b5263">LEDs, botones y sensor.</text>

  <!-- menu desplegable -->
  <rect x="40" y="120" width="210" height="130" fill="#171a26" opacity="0.97"/>
  <rect x="40" y="120" width="210" height="130" fill="none" stroke="#2a2f42"/>
  <rect x="40" y="136" width="4" height="34" fill="#4cc9f0"/>
  <text x="60" y="158" fill="#fff" font-size="14">💧  Depósito de agua</text>
  <text x="60" y="198" fill="#fff" font-size="14">🕸  Memoria</text>
  <line x1="56" y1="176" x2="234" y2="176" stroke="#2a2f42"/>
  <text x="60" y="236" fill="#8892a6" font-size="10">Pulsa fuera o Esc para cerrar</text>

  <!-- ===== Pantalla 2: Memoria ===== -->
  <text x="470" y="62" fill="#4b5263" font-size="12" font-weight="600">2 · Memoria ( /memoria ): el grafo en directo</text>
  <rect x="470" y="72" width="390" height="440" rx="10" fill="#0f111a" stroke="#c4cada"/>
  <rect x="470" y="72" width="390" height="48" rx="10" fill="#171a26"/>
  <rect x="470" y="100" width="390" height="20" fill="#171a26"/>
  <rect x="486" y="88" width="22" height="3" rx="1.5" fill="#fff"/>
  <rect x="486" y="95" width="22" height="3" rx="1.5" fill="#fff"/>
  <rect x="486" y="102" width="22" height="3" rx="1.5" fill="#fff"/>
  <text x="522" y="103" fill="#fff" font-size="16" font-weight="700">Memoria</text>
  <rect x="740" y="86" width="104" height="22" rx="11" fill="#12301f"/>
  <circle cx="755" cy="97" r="4" fill="#80ed99"/>
  <text x="766" y="101" fill="#80ed99" font-size="11">en directo</text>

  <!-- filtros -->
  <rect x="486" y="132" width="150" height="24" rx="12" fill="#171a26" stroke="#2a2f42"/>
  <text x="500" y="148" fill="#6b7386" font-size="11">Buscar entidad…</text>
  <rect x="646" y="132" width="52" height="24" rx="12" fill="#4cc9f0"/><text x="672" y="148" fill="#0f111a" font-size="11" text-anchor="middle">Todas</text>
  <rect x="706" y="132" width="62" height="24" rx="12" fill="#171a26" stroke="#2a2f42"/><text x="737" y="148" fill="#b8c0d4" font-size="11" text-anchor="middle">Personas</text>
  <rect x="776" y="132" width="68" height="24" rx="12" fill="#171a26" stroke="#2a2f42"/><text x="810" y="148" fill="#b8c0d4" font-size="11" text-anchor="middle">Lugares</text>

  <!-- mini grafo -->
  <line x1="640" y1="300" x2="570" y2="250" stroke="#8892a6" stroke-width="2"/>
  <line x1="570" y1="250" x2="520" y2="200" stroke="#4b5263" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="570" y1="250" x2="530" y2="350" stroke="#80ed99" stroke-width="3"/>
  <line x1="640" y1="300" x2="740" y2="250" stroke="#8892a6" stroke-width="2"/>
  <line x1="640" y1="300" x2="730" y2="380" stroke="#8892a6" stroke-width="2"/>
  <circle cx="640" cy="300" r="26" fill="#f72585"/><text x="640" y="304" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Usuario</text>
  <circle cx="570" cy="250" r="19" fill="#4cc9f0"/><text x="570" y="254" fill="#0f111a" font-size="10" font-weight="600" text-anchor="middle">Ana</text>
  <circle cx="520" cy="200" r="15" fill="#80ed99" opacity="0.45"/>
  <circle cx="530" cy="350" r="34" fill="#80ed99" opacity="0.25"/>
  <circle cx="530" cy="350" r="16" fill="#80ed99" stroke="#fff" stroke-width="2"/>
  <circle cx="740" cy="250" r="19" fill="#f9c74f"/>
  <circle cx="730" cy="380" r="19" fill="#f9c74f"/>

  <!-- aviso de token -->
  <rect x="486" y="420" width="358" height="34" rx="8" fill="#171a26" stroke="#2a2f42"/>
  <text x="500" y="441" fill="#b8c0d4" font-size="11">🔒 Los datos se piden con un token (se guarda en tu navegador)</text>

  <!-- barra temporal -->
  <rect x="486" y="466" width="358" height="30" rx="8" fill="#171a26" stroke="#2a2f42"/>
  <polygon points="500,474 500,488 512,481" fill="#e6e9f2"/>
  <rect x="526" y="479" width="290" height="4" rx="2" fill="#2a2f42"/>
  <rect x="526" y="479" width="240" height="4" rx="2" fill="#4cc9f0"/>
  <circle cx="766" cy="481" r="7" fill="#4cc9f0"/>
</svg>
